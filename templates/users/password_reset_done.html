{% extends "base.html" %}

{% block title %}Check Your Email — Gigframe{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-20 text-center">
  <div class="text-5xl mb-4">📧</div>
  <h1 class="text-2xl font-bold text-gray-900 mb-3">Check your email</h1>
  <p class="text-gray-600">
    If an account exists with that email, we've sent a link to reset your password. It should arrive within a few minutes.
  </p>
  <a href="{% url 'login' %}" class="inline-block mt-8 text-brand-800 font-semibold hover:underline">Back to sign in</a>
</section>
{% endblock %}
