{% extends "base.html" %}

{% block title %}Reset Password — Gigframe{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-20">
  <h1 class="text-3xl font-bold text-gray-900 mb-2">Reset your password</h1>
  <p class="text-gray-600 mb-8">Enter your email and we'll send you a link to reset your password.</p>

  <form method="post" class="space-y-5">
    {% csrf_token %}
    <div>
      <label for="{{ form.email.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
      {{ form.email }}
    </div>
    <button type="submit" class="w-full bg-brand-900 text-white font-semibold py-3 rounded-full hover:bg-brand-950 transition">
      Send Reset Link
    </button>
  </form>

  <p class="text-sm text-gray-600 mt-6 text-center">
    <a href="{% url 'login' %}" class="text-brand-800 font-semibold hover:underline">Back to sign in</a>
  </p>
</section>
{% endblock %}

{% block extra_head %}
<style>
  input[type="email"] {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #d1d5db;
    border-radius: 0.75rem;
    outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #0e3b36; box-shadow: 0 0 0 3px rgba(14, 59, 54, 0.1); }
</style>
{% endblock %}
