{% extends "base.html" %}

{% block title %}Add Education — Gigframe{% endblock %}

{% block content %}
<section class="max-w-lg mx-auto px-6 py-16">
  <h1 class="text-3xl font-bold text-gray-900 mb-8">Add Education</h1>

  <form method="post" class="space-y-5">
    {% csrf_token %}

    <div>
      <label for="{{ form.school.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1.5">School / University</label>
      {{ form.school }}
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="{{ form.degree.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1.5">Degree</label>
        {{ form.degree }}
      </div>
      <div>
        <label for="{{ form.field_of_study.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1.5">Field of study</label>
        {{ form.field_of_study }}
      </div>
    </div>

    <div>
      <label for="{{ form.graduation_year.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1.5">Graduation year</label>
      {{ form.graduation_year }}
    </div>

    <button type="submit" class="w-full bg-brand-900 text-white font-semibold py-3 rounded-full hover:bg-brand-950 transition">
      Add Education
    </button>
  </form>
</section>
{% endblock %}

{% block extra_head %}
<style>
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #d1d5db;
    border-radius: 0.75rem;
    outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #0e3b36; box-shadow: 0 0 0 3px rgba(14, 59, 54, 0.1); }
</style>
{% endblock %}
