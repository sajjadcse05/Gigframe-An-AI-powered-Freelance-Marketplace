{% extends "base.html" %}

{% block title %}Password Changed — Gigframe{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-20 text-center">
  <div class="text-5xl mb-4">✅</div>
  <h1 class="text-2xl font-bold text-gray-900 mb-3">Password changed</h1>
  <p class="text-gray-600 mb-8">Your password has been updated. You can now sign in.</p>
  <a href="{% url 'login' %}" class="inline-block bg-brand-900 text-white font-semibold px-6 py-3 rounded-full hover:bg-brand-950 transition">
    Sign In
  </a>
</section>
{% endblock %}
