{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto mt-10 bg-white rounded-2xl border border-gray-200 p-6">
  <h1 class="text-xl font-bold text-gray-900 mb-2">Request Cancellation</h1>
  <p class="text-sm text-gray-500 mb-6">
    "{{ contract.job.title }}" — ৳{{ contract.amount }} in escrow.
    The other party will have 48 hours to respond.
  </p>

  <form method="post">
    {% csrf_token %}
    <label class="block text-sm font-medium text-gray-700 mb-2">Reason for cancellation</label>
    <textarea name="reason" rows="4" required
      class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-red-300"
      placeholder="e.g. Unable to complete the work due to..."></textarea>
    <button type="submit" class="w-full py-2.5 rounded-xl bg-red-600 text-white text-sm font-semibold hover:bg-red-700">
      Submit Cancellation Request
    </button>
  </form>
</div>
{% endblock %}
